name: Test kubeconform strict linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          manifests: ${{ github.workspace }}/actions/hardened/azure--k8s-lint/v4.0.0/tests/fixtures/deployment.yaml
          lintType: kubeconform
          kubeconformOpts: '-strict -summary'
          namespace: default
      - name: Assert action completed successfully
        run: |
          echo "Action completed with strict mode without error"
          echo "PASS"
