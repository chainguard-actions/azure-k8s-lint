name: Test kubeconform lint with strict mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubeconform
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
          curl -sSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${ARCH}.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Run kubeconform lint with strict mode
        id: action
        uses: .
        with:
          manifests: tests/fixtures/valid-deployment.yaml
          lintType: kubeconform
          kubeconformOpts: '-strict'

      - name: Assert action succeeded with strict mode
        run: |
          echo "PASS: kubeconform lint succeeded in strict mode on valid manifest"
