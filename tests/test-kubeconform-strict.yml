name: Test kubeconform lint - strict mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform
          kubeconform -v

      - name: Run kubeconform lint with strict mode options
        id: action
        uses: .
        with:
          manifests: tests/fixtures/manifests/valid-deployment.yaml
          lintType: kubeconform
          kubeconformOpts: '-strict'

      - name: Assert action succeeded with strict mode
        run: |
          echo "PASS: kubeconform lint succeeded with strict mode on valid manifest"
