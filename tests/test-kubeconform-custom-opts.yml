name: Test kubeconform with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock kubeconform
        run: |
          printf '#!/bin/bash\necho "kubeconform mock: $@"\nexit 0\n' > /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform
      - name: Run kubeconform lint with verbose output
        id: action
        uses: .
        with:
          manifests: ${{ github.workspace }}/pristine/azure--k8s-lint/v4.0.0/tests/fixtures/valid-deployment.yml
          lintType: kubeconform
          kubeconformOpts: '-verbose'
      - name: Assert action succeeded with custom opts
        run: |
          echo "Action completed successfully with custom kubeconform options"
          echo "PASS"
