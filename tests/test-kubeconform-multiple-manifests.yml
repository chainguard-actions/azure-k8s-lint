name: Test kubeconform lint with multiple manifests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create second valid manifest
        run: |
          cat > /tmp/service.yaml << 'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-service
          spec:
            selector:
              app: nginx
            ports:
            - protocol: TCP
              port: 80
              targetPort: 80
          EOF

      - name: Run kubeconform lint on multiple manifests
        id: action
        uses: .
        with:
          manifests: |
            tests/fixtures/valid-deployment.yaml
            /tmp/service.yaml
          lintType: kubeconform
          kubeconformOpts: '-summary'

      - name: Assert action succeeded for multiple manifests
        run: |
          echo "PASS: kubeconform lint succeeded on multiple manifests"
