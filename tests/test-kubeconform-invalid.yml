name: Test kubeconform lint with invalid manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run kubeconform lint on invalid manifest
        id: action
        uses: .
        with:
          manifests: tests/fixtures/invalid-manifest.yaml
          lintType: kubeconform
          kubeconformOpts: '-summary'
        continue-on-error: true

      - name: Assert action failed on invalid manifest
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid manifest but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid manifest"
