name: Test kubeconform lint with invalid manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubeconform
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
          curl -sSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${ARCH}.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Run kubeconform lint on invalid manifest (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/invalid-manifest.yaml
          lintType: kubeconform
          kubeconformOpts: '-summary'

      - name: Assert action failed on invalid manifest
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid manifest, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid manifest"
