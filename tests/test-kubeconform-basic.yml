name: Test kubeconform lint with valid manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run kubeconform lint on valid manifest
        id: action
        uses: .
        with:
          manifests: tests/fixtures/valid-deployment.yaml
          lintType: kubeconform
          kubeconformOpts: '-summary'

      - name: Assert action succeeded
        run: |
          echo "PASS: kubeconform lint succeeded on valid manifest"
