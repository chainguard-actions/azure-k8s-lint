name: Test kubeconform with invalid manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock kubeconform that fails
        run: |
          printf '#!/bin/bash\necho "kubeconform mock: validation failed for $@"\nexit 1\n' > /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform
      - name: Run kubeconform lint on invalid manifest (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          manifests: ${{ github.workspace }}/pristine/azure--k8s-lint/v4.0.0/tests/fixtures/invalid-manifest.yml
          lintType: kubeconform
          kubeconformOpts: '-strict'
      - name: Assert action failed for invalid manifest
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid manifest, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid manifest"
