name: Test kubeconformOpts -strict rejects unknown fields
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: lenient
        uses: .
        with:
          manifests: tests/fixtures/unknown-field-service.yaml
      - id: strict
        uses: .
        continue-on-error: true
        with:
          manifests: tests/fixtures/unknown-field-service.yaml
          kubeconformOpts: -strict
      - name: Assert lenient passed and strict failed
        env:
          LENIENT: ${{ steps.lenient.outcome }}
          STRICT: ${{ steps.strict.outcome }}
        run: |
          echo "lenient: $LENIENT strict: $STRICT"
          if [ "$LENIENT" != "success" ]; then
            echo "FAIL: expected default options to accept the unknown field"
            exit 1
          fi
          if [ "$STRICT" != "failure" ]; then
            echo "FAIL: expected -strict to reject the unknown field"
            exit 1
          fi
          echo "PASS"
