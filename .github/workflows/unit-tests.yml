name: 'Run unit tests'
on: # rebuild any PRs and main branch changes
   pull_request:
      branches:
         - main
         - 'releases/*'
   push:
      branches:
         - main
         - 'releases/*'

permissions: {}

jobs:
   build: # make sure build/ci works properly
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
         - name: Run L0 tests.
           run: |
              npm install
              npm test
